# Grupo JF project-scoped Codex configuration.
# Codex loads this file only when the project is trusted.

approval_policy = "on-request"
default_permissions = "grupojf-workspace"
web_search = "cached"
model_reasoning_effort = "high"
project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["CONTRIBUTING.md", "README.md"]

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false
exclude = [
  "DATABASE_URL",
  "DB_*",
  "POSTGRES_*",
  "JWT_*",
  "WAPI_*",
  "BEMPAGGO_*",
  "DELTA_*",
  "API_KEY_PUBLIC",
]

[permissions.grupojf-workspace.filesystem]
glob_scan_max_depth = 5

[permissions.grupojf-workspace.filesystem.":workspace_roots"]
"." = "write"
".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"backend/venv" = "deny"
"frontend/node_modules" = "deny"
"frontend/build" = "deny"
"backend/arquivos" = "deny"
"logs" = "deny"
"backend/logs" = "deny"

[permissions.grupojf-workspace.network]
enabled = false
